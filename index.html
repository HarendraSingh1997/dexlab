<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23FF3355'/%3E%3Crect x='4' y='44' width='92' height='12' fill='%23060A1A'/%3E%3Ccircle cx='50' cy='50' r='16' fill='white'/%3E%3Ccircle cx='50' cy='50' r='9' fill='%23060A1A'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DEXLAB — a field-research Pokédex. Search 1025+ Pokémon, inspect stats, cries and moves." />
    <title>DEXLAB — Field Research Pokédex</title>
    <script>
      // Pre-paint theme: stored choice wins, otherwise follow the OS.
      try {
        var t = localStorage.getItem('dexlab:theme');
        if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
